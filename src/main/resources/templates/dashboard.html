<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>
</head>
<body>

<!-- Menu selon le rôle -->
<div th:replace="fragments/admin-header :: adminHeader"></div>

<div class="container mt-5 text-center">
    <!-- Message pour ADMIN -->
    <h2 sec:authorize="hasRole('ROLE_ADMIN')">Bienvenue, Admin sur votre tableau de bord</h2>

    <!-- Message pour USER -->
    <h2 sec:authorize="hasRole('ROLE_USER')">Bienvenue sur Pay My Buddy</h2>

    <!-- Message de succès -->
    <div th:if="${success}" class="alert alert-success mt-4" th:text="${success}"></div>
</div>

</body>
</html>
