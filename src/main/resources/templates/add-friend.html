<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un ami - Pay My Buddy</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>
</head>
<body>

<!-- Menu standard USER -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Pay My Buddy</a>
        <div class="collapse navbar-collapse justify-content-between">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/transactions/transfer">Transférer</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/profile">Profil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/friends/add">Ajouter relation</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Se déconnecter</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5 d-flex flex-column align-items-center">
    <form th:action="@{/friends/add-new}" method="post" class="d-flex align-items-end">
        <div class="me-3">
            <label for="email" class="form-label"><strong>Chercher une relation</strong></label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Saisir une adresse mail" required>
        </div>
        <div>
            <button type="submit" class="btn btn-warning">Ajouter</button>
        </div>
    </form>

    <!-- Affichage des messages -->
    <div class="mt-4 w-50">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    </div>
</div>

</body>
</html>
