<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pay My Buddy - Connexion</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>
</head>
<body class="login-body">

<div class="login-container text-center">
    <div class="login-title">Pay My Buddy</div>

    <!-- Affichage des messages flash  -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div th:if="${param.error}" class="alert alert-danger">
            Identifiants incorrects, veuillez réessayer.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            Déconnexion réussie.
        </div>

        <div class="mb-3">
            <input type="email" id="username" name="username" class="form-control" placeholder="Mail" required>
        </div>

        <div class="mb-3">
            <input type="password" id="password" name="password" class="form-control" placeholder="Mot de passe" required>
        </div>

        <button type="submit" class="btn btn-login w-100">Se connecter</button>
        <p class="mt-3">
            Pas encore inscrit ? <a th:href="@{/register}">Créer un compte</a>
        </p>
    </form>
</div>

</body>
</html>
