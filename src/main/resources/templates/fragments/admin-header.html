<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body th:fragment="adminHeader">
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Pay My Buddy</a>
        <div class="collapse navbar-collapse justify-content-between">
            <ul class="navbar-nav">

                <!-- Tableau de bord : visible seulement pour ADMIN -->
                <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                    <a class="nav-link" href="/dashboard">Tableau de bord</a>
                </li>

                <!-- Transférer : visible pour USER uniquement -->
                <li class="nav-item" sec:authorize="hasRole('ROLE_USER')">
                    <a class="nav-link" href="/transactions/transfer">Transférer</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                    <a class="nav-link disabled" href="#" style="pointer-events: none; opacity: 0.5;" aria-disabled="true">
                        Transférer
                    </a>
                </li>

                <!-- Profil : visible pour USER uniquement -->
                <li class="nav-item" sec:authorize="hasRole('ROLE_USER')">
                    <a class="nav-link" href="/profile">Profil</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                    <a class="nav-link disabled" href="#" style="pointer-events: none; opacity: 0.5;" aria-disabled="true">
                        Profil
                    </a>
                </li>

                <!-- Ajouter relation : visible pour USER uniquement -->
                <li class="nav-item" sec:authorize="hasRole('ROLE_USER')">
                    <a class="nav-link" href="/friends/add">Ajouter relation</a>
                </li>

                <!-- Transactions (admin) : seulement visible pour ADMIN -->
                <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                    <a class="nav-link" href="/admin/transactions">Transactions (admin)</a>
                </li>

            </ul>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <span class="nav-link text-black">Connecté en tant que
                        <strong th:text="|${user.firstName}|">Admin</strong>
                    </span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Se déconnecter</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
