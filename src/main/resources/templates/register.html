<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inscription - Pay My Buddy</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="register-body">
<div class="container-register">
    <div class="brand-title">Pay My Buddy</div>

    <form action="/register" method="post">
        <input type="text" class="form-control" name="firstName" id="firstName" placeholder="Username" required>
        <input type="hidden" class="form-control" name="lastName" id="lastName">
        <input type="email" class="form-control" name="email" placeholder="Mail" required>
        <input type="password" class="form-control" name="password" placeholder="Mot de passe" required>
        <button type="submit" class="btn btn-primary">S'inscrire</button>
    </form>

    <p class="mt-3">
        Déjà un compte ? <a th:href="@{/login}">Se connecter</a>
    </p>

    <!-- Affichage des erreurs -->
    <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>
</div>


<script>
    document.querySelector('form').addEventListener('submit', function() {
        const firstNameValue = document.getElementById('firstName').value;
        document.getElementById('lastName').value = firstNameValue;
    });
</script>
</body>
</html>
